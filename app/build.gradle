plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chris.uberratebanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chris.uberratebanner'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled OCR model: works offline immediately and does not require a model download.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
